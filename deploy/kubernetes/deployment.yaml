apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-proton-pass
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: eso-proton-pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eso-proton-pass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eso-proton-pass
    spec:
      # The bridge never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: ghcr.io/sapn95/eso-proton-pass:0.1.0
          ports:
            - name: http
              containerPort: 8080
          # Files rather than variables: a variable sits in
          # /proc/<pid>/environ for the life of the process, and every child
          # of it can read that. The bridge reads the files when it needs them.
          env:
            - name: PROTON_PASS_PERSONAL_ACCESS_TOKEN_FILE
              value: /secrets/pat/pat
            - name: BRIDGE_TOKEN_FILE
              value: /secrets/token/token
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: session
              mountPath: /session
            - name: pat
              mountPath: /secrets/pat
              readOnly: true
            - name: token
              mountPath: /secrets/token
              readOnly: true
      volumes:
        - name: pat
          secret:
            secretName: eso-proton-pass-pat
            defaultMode: 0440
        - name: token
          secret:
            secretName: eso-proton-pass-token
            defaultMode: 0440
        # The Proton session and its key. Gone with the pod, which is fine:
        # the bridge logs in again on start.
        - name: session
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
