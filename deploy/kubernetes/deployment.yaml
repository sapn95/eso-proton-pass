apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-proton-pass
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: eso-proton-pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eso-proton-pass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eso-proton-pass
    spec:
      # The bridge never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: ghcr.io/sapn95/eso-proton-pass:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROTON_PASS_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eso-proton-pass-pat
                  key: pat
            - name: BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eso-proton-pass-token
                  key: token
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: session
              mountPath: /session
      volumes:
        # The Proton session and its key. Gone with the pod, which is fine:
        # the bridge logs in again on start.
        - name: session
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
