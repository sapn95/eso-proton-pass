# One store for the whole cluster. Each ExternalSecret reads from the vault
# named after its own namespace (k8s-<namespace>); the namespace in the URL
# is filled in by ESO, not by whoever writes the ExternalSecret.
#
# ESO query-escapes .remoteRef.key and .remoteRef.property itself when it
# renders this URL (url.QueryEscape in its webhook provider), so a key with
# "&namespace=" in it arrives as one escaped value. Piping them through
# urlquery here would escape them twice. namespace stays the first
# parameter all the same: the bridge reads the first one.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: proton-pass
spec:
  provider:
    webhook:
      url: "http://eso-proton-pass.external-secrets.svc:8080/v1/secret?namespace={{ .remoteRef.namespace }}&key={{ .remoteRef.key }}&property={{ .remoteRef.property }}"
      method: GET
      timeout: 30s
      headers:
        Authorization: "Bearer {{ print .auth.token }}"
      result:
        jsonPath: "$.value"
      secrets:
        - name: auth
          secretRef:
            name: eso-proton-pass-token
            namespace: external-secrets
