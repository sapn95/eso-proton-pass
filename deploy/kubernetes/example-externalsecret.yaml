# Not part of the kustomization: what an application writes. Reads the field
# "value" of the item "anthropic" from the vault k8s-aemtli, because this
# ExternalSecret lives in the namespace aemtli.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model
  namespace: aemtli
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-pass
  target:
    name: model
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic
        property: value
